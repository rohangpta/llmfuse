version: '3.8'

services:
  # FUSE-enabled data generation service
  datagen:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    privileged: true  # Required for FUSE
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./common:/app/common:ro
      - ./train:/app/train:ro
      - ./eval:/app/eval:ro
      - ./llmfuse:/app/llmfuse:ro
      - ./llmencode:/app/llmencode:ro
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: ["python", "-m", "train.generate_data", "--num_examples", "100", "--output_dir", "/app/data/train"]

  # Integration test: mount LLM-backed FUSE and run end-to-end ops
  fuse_integration:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    privileged: true  # Required for FUSE
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data:/app/data
      - ./common:/app/common:ro
      - ./train:/app/train:ro
      - ./eval:/app/eval:ro
      - ./llmfuse:/app/llmfuse:ro
      - ./llmencode:/app/llmencode:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Optional: choose model backend for llmfuse
      - LLMFUSE_MODEL=${LLMFUSE_MODEL:-qwen3-0.6b}
      # Mountpoint inside the container
      - FUSE_MOUNT=/tmp/fuse_mount
      # Test script to run against the mounted fs
      - INTEG_SCRIPT=/app/eval/llmfuse_integration_test.py
    command: ["bash", "-lc", "set -euo pipefail; mkdir -p \"$FUSE_MOUNT\"; python llmfuse/llmfuse.py \"$FUSE_MOUNT\" & pid=$$!; sleep 2; python \"$INTEG_SCRIPT\" \"$FUSE_MOUNT\"; rc=$$?; fusermount -u \"$FUSE_MOUNT\" || umount \"$FUSE_MOUNT\" || true; kill $$pid || true; exit $$rc"]
