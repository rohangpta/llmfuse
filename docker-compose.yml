version: '3.8'

services:
  # Data generation service (Linux environment for consistent stat output)
  datagen:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./train:/app/train:ro
      - ./llmfuse:/app/llmfuse:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: ["python", "-c", "import os; os.makedirs('/app/data', exist_ok=True); from train.generate_data import generate_data; generate_data(num_examples=100, output_file='/app/data/training_data_linux.json')"]
    
  # FUSE-enabled data generation service (for generating training data with real FUSE operations)
  datagen-fuse:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    privileged: true  # Required for FUSE
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./train:/app/train:ro
      - ./llmfuse:/app/llmfuse:ro
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: ["python", "-c", "import os; os.makedirs('/app/data', exist_ok=True); from train.generate_data import generate_data; generate_data(num_examples=10000, output_file='/app/data/training_data.jsonl', hf_format=True)"]
    
  # End-to-end evaluation service (with FUSE support for real filesystem testing)
  eval:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    privileged: true  # Required for FUSE
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./train:/app/train:ro
      - ./eval:/app/eval:ro
      - ./llmfuse:/app/llmfuse:ro
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: ["python", "eval/eval_end_to_end.py"]


