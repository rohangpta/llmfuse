version: '3.8'

services:
  # FUSE-enabled data generation service
  datagen:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    privileged: true  # Required for FUSE
    volumes:
      - ./data:/app/data
      - ./common:/app/common:ro
      - ./train:/app/train:ro
      - ./eval:/app/eval:ro
      - ./llmfuse:/app/llmfuse:ro
      - ./llmencode:/app/llmencode:ro
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: ["python", "-m", "train.generate_data", "--num_examples", "100", "--output_dir", "/app/data/train"]
    
  # End-to-end evaluation service
  eval:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    privileged: true  # Required for FUSE
    volumes:
      - ./data:/app/data
      - ./common:/app/common:ro
      - ./train:/app/train:ro
      - ./eval:/app/eval:ro
      - ./llmfuse:/app/llmfuse:ro
      - ./llmencode:/app/llmencode:ro
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: ["python", "eval/eval_main.py"]


